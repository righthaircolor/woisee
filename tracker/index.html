<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1110">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>woisee · трекер голоса</title>
<link rel="stylesheet" href="fonts.css">
<style>
:root{
  --paper:#0B1110; --paper-2:#172120; --paper-3:#22302E; --soft:#2C3836; --ink:#F4F2EC; --muted:#9AA7A3; --rule:rgba(255,254,252,.12);
  --signal:#F0472C; --lime:#ECF176; --rasp:#E780C0; --kale:#5EA879; --ebony:#192524; --vanilla:#FFFEFC; --ground:#0E1514;
  --f:"Inter Tight","Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--paper);height:100%}
body{margin:0;color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.45;letter-spacing:-.005em;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.035em;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:12px}
button:disabled{cursor:default}
canvas{display:block;width:100%}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}

.app{max-width:480px;margin:0 auto;padding:calc(var(--safe-t) + 14px) 16px calc(var(--safe-b) + 110px);min-height:100%}
.view{display:flex;flex-direction:column}

/* ---- сегодня ---- */
.brand{display:flex;justify-content:space-between;align-items:center;height:28px}
.brand b{font-weight:800;letter-spacing:-.05em;font-size:20px}
.brand a{color:var(--muted);font-size:12px;text-decoration:none}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:18px}
.wd{display:flex;flex-direction:column;align-items:center;gap:8px}
.wd>span{font-size:13px;font-weight:600;color:var(--ink)}
.wd.fut>span{color:var(--muted)}
.dc{width:100%;max-width:48px;aspect-ratio:1;border-radius:50%;background:var(--paper-2);box-shadow:inset 0 0 0 1px rgba(255,254,252,.08);display:grid;place-items:center;overflow:hidden;position:relative;color:var(--muted)}
.dc canvas{position:absolute;inset:0;width:100%;height:100%}
.dc svg.i{width:18px;height:18px}
.dc.today{box-shadow:inset 0 0 0 1.5px rgba(255,254,252,.5);color:var(--ink)}
.dc.fut{background:#111A19;box-shadow:none}
.dc.miss{background:transparent;box-shadow:inset 0 0 0 1px rgba(255,254,252,.1)}
.q{font-size:clamp(34px,10vw,44px);line-height:1;text-align:center;margin-top:40px}
.ringwrap{position:relative;width:min(100%,320px);aspect-ratio:1;margin:30px auto 0}
.ringwrap canvas{position:absolute;inset:0;height:100%}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:12px}
.plus{width:70px;height:70px;border-radius:50%;background:var(--ink);color:var(--ebony);display:grid;place-items:center}
.plus svg.i{width:30px;height:30px;stroke-width:2}
.center .lbl{font-size:17px;font-weight:500}
.todaytxt{text-align:center;margin-top:18px;display:flex;flex-direction:column;align-items:center;gap:10px}
.todaytxt b{font-size:20px;font-weight:700;letter-spacing:-.02em}
.pill{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;background:var(--paper-2);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.pill .m{color:var(--muted)}
.pill svg.i{width:16px;height:16px}
.streakrow{display:flex;justify-content:center;margin-top:24px}
.histtog{display:flex;justify-content:center;margin-top:14px}
.histtog button{font-size:12px;color:var(--muted);padding:6px 10px;border-radius:999px}
.histtog button b{color:var(--ink);font-weight:600}

/* ---- top controls (месяц, данные) ---- */
.topctl{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:4px}
.seg3{display:flex;background:var(--paper-2);border-radius:999px;padding:4px;box-shadow:inset 0 0 0 1px rgba(255,254,252,.06)}
.seg3 button{width:46px;height:40px;border-radius:999px;font-weight:600;font-size:15px;color:var(--muted);display:grid;place-items:center}
.seg3 button[aria-selected="true"]{background:var(--paper-3);color:var(--ink)}
.pnav{display:flex;align-items:center;justify-content:space-between;gap:4px;background:var(--paper-2);border-radius:999px;padding:4px;flex:1;max-width:260px;box-shadow:inset 0 0 0 1px rgba(255,254,252,.06)}
.pnav button{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.pnav button:disabled{opacity:.25}
.pnav span{font-size:14px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;text-align:center;flex:1;white-space:nowrap}
.pnav.static{justify-content:center;padding:0 16px;height:48px}
.vtitle{font-size:34px;line-height:1;margin:22px 0 4px}

/* ---- месяц ---- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px 6px;margin-top:18px}
.cal .wh{font-size:12px;color:var(--muted);text-align:center;font-weight:600}
.cd{display:flex;flex-direction:column;align-items:center;gap:4px}
.cd .dc{max-width:46px}
.cd small{font-size:11px;color:var(--muted)}
.cd.sel .dc{box-shadow:inset 0 0 0 2px var(--ink)}
.cd.sel small{color:var(--ink);font-weight:700}
.card{margin-top:12px;background:var(--paper-2);border-radius:26px;padding:18px 16px;position:relative}
.card h2{font-size:24px;line-height:1.05}
.card .sub{font-size:13px;color:var(--muted);margin-top:4px}
.card canvas{margin-top:14px;border-radius:16px}
.daytop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.daytop .k{font-size:13px;color:var(--muted)}
.dayform{width:96px;flex:none;aspect-ratio:1;border-radius:50%;background:var(--ground);overflow:hidden}
.dayform canvas{margin:0;border-radius:0;height:100%}
.rows{margin-top:14px;display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 0;border-top:1px solid var(--rule)}
.row span{color:var(--muted);font-size:14px}
.row b{font-weight:600;text-align:right}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:.04em}
.empty{padding:22px 4px;color:var(--muted);text-align:center;font-size:14px}

/* ---- данные ---- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.tile{background:var(--paper-2);border-radius:20px;padding:14px}
.tile .l{font-size:12px;color:var(--muted);font-weight:500}
.tile .v{font-size:34px;font-weight:800;letter-spacing:-.04em;line-height:1;margin-top:8px}
.tile .v small{font-size:18px;color:var(--muted);font-weight:700;letter-spacing:-.02em}
.tile .s{font-size:12px;color:var(--muted);margin-top:6px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--ebony);font-size:12px;line-height:1.3;padding:7px 9px;border-radius:10px;white-space:nowrap;transform:translate(-50%,-100%);opacity:0;transition:opacity .12s;z-index:5}
figcaption{font-size:13px;color:var(--muted);margin-top:10px}
.mini{display:flex;gap:4px;margin-top:12px}
.mini button{font-size:12px;font-weight:600;padding:6px 10px;border-radius:999px;color:var(--muted);background:var(--paper)}
.mini button[aria-selected="true"]{color:var(--ink);background:var(--paper-3)}
.how{margin-top:22px;padding:4px 2px}
.how h3{font-size:18px}
.how ul{padding-left:18px;margin:10px 0 0;display:flex;flex-direction:column;gap:6px}
.how li{font-size:13px;color:var(--muted)}

/* ---- tab bar ---- */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-b) + 14px);width:min(calc(100% - 32px),448px);display:flex;gap:4px;padding:5px;border-radius:999px;background:rgba(23,33,32,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:inset 0 0 0 1px rgba(255,254,252,.08),0 10px 30px rgba(0,0,0,.4);z-index:30}
.tabbar button{flex:1;height:54px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:14px;font-weight:600;transition:background .2s,color .2s}
.tabbar button[aria-selected="true"]{background:var(--paper-3);color:var(--ink)}
.tabbar svg.i{width:24px;height:24px}

/* ---- flow ---- */
.flow{position:fixed;inset:0;z-index:50;background:var(--paper);display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain}
.fin{width:100%;max-width:480px;margin:0 auto;padding:calc(var(--safe-t) + 10px) 16px 0;display:flex;flex-direction:column;flex:1}
.ftop{display:flex;align-items:center;gap:14px;height:52px}
.rbtn{width:48px;height:48px;border-radius:50%;background:var(--paper-2);display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,254,252,.08);flex:none}
.fprog{display:flex;gap:5px;flex:1}
.fprog i{flex:1;height:5px;border-radius:5px;background:var(--soft);transition:background .3s}
.fprog i.on{background:var(--ink)}
.fprog i.cur{background:rgba(244,242,236,.55)}
.fspace{width:48px;flex:none}
.fhead{margin-top:14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.fhead .kick{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;min-height:1em}
.fhead h2{font-size:clamp(26px,7.6vw,34px);line-height:1.02}
.fhead h2 em{font-style:normal}
.fhead p{color:var(--muted);font-size:15px;max-width:34ch}
.stage{position:relative;margin-top:14px;border-radius:26px;overflow:hidden;background:var(--ground);flex:none}
.stage canvas{height:100%}
.zones{position:absolute;inset:0;pointer-events:none}
.zb{position:absolute;left:10px;transform:translateY(-50%);text-align:left;display:flex;flex-direction:column;gap:1px;padding:6px 10px;border-radius:14px;max-width:40%;transition:background .25s,opacity .25s,box-shadow .25s;opacity:.6}
.zb b{font-size:15px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.zb span{font-size:11px;color:var(--muted);line-height:1.25}
.stage.pick .zb{pointer-events:auto;opacity:.9}
.stage.pick .zb:active{background:rgba(255,254,252,.1)}
.stage.compact .zb span{display:none}
.zb.on{opacity:1;box-shadow:inset 2px 0 0 var(--zc,var(--ink))}
.zb.guess{opacity:1;background:rgba(236,241,118,.12)}
.zb.guess b{color:var(--lime)}
.timer{position:absolute;right:14px;top:12px;text-align:right;pointer-events:none}
.timer b{display:block;font-size:40px;font-weight:800;letter-spacing:-.04em;line-height:1}
.timer span{display:block;font-size:12px;color:var(--muted);margin-top:4px;min-height:1.2em}
.fres{display:flex;flex-direction:column;margin-top:12px}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;background:var(--paper-2);font-size:14px}
.chip svg.i{width:16px;height:16px}
.fctl{position:sticky;bottom:0;margin-top:auto;padding:16px 0 calc(var(--safe-b) + 18px);background:linear-gradient(to bottom,rgba(11,17,16,0),var(--paper) 30%);display:flex;align-items:center;justify-content:space-between;gap:12px}
.play{width:78px;height:78px;border-radius:50%;background:var(--ink);color:var(--ebony);display:grid;place-items:center}
.play svg.i{width:30px;height:30px;stroke-width:2.2}
.play.done{background:var(--paper-2);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(255,254,252,.12)}
.next{height:56px;padding:0 20px;border-radius:999px;background:var(--paper-2);display:flex;align-items:center;gap:6px;font-weight:700;box-shadow:inset 0 0 0 1px rgba(255,254,252,.1)}
.next.go{background:var(--ink);color:var(--ebony);box-shadow:none}
.back{height:56px;width:56px}
.wide{flex:1;height:58px;border-radius:999px;background:var(--ink);color:var(--ebony);font-weight:700;font-size:17px}
.ghostlink{font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:8px}
.labsw{display:flex;gap:4px;background:var(--paper-2);border-radius:999px;padding:4px}
.labsw button{padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.labsw button[aria-selected="true"]{background:var(--paper-3);color:var(--ink)}
.err{color:var(--signal);font-size:13px;text-align:center}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">

  <!-- ============ СЕГОДНЯ ============ -->
  <section class="view" id="vToday" aria-label="Сегодня">
    <div class="brand"><b>woisee</b><a href="../index.html">в приложение</a></div>
    <div class="week" id="week"></div>
    <h1 class="q" id="greet">Как ты звучишь сегодня?</h1>
    <div class="ringwrap" id="ringwrap">
      <canvas id="ringCv" aria-hidden="true"></canvas>
      <div class="center" id="ringCenter"></div>
    </div>
    <div class="todaytxt" id="todayTxt"></div>
    <div class="streakrow"><span class="pill" id="streak"></span></div>
    <div class="histtog"><button id="histBtn"></button></div>
  </section>

  <!-- ============ МЕСЯЦ ============ -->
  <section class="view" id="vMonth" aria-label="Месяц" hidden>
    <div class="topctl"><h1 class="vtitle" style="margin:0">Месяц</h1>
      <div class="pnav"><button id="mPrev" aria-label="Предыдущий месяц"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><span id="mLabel"></span><button id="mNext" aria-label="Следующий месяц"><svg class="i" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button></div>
    </div>
    <div class="cal" id="cal"></div>
    <div id="dayCard"></div>
  </section>

  <!-- ============ ДАННЫЕ ============ -->
  <section class="view" id="vData" aria-label="Данные" hidden>
    <div class="topctl">
      <div class="seg3" role="tablist" aria-label="Период">
        <button role="tab" data-per="w" aria-selected="false" aria-label="Неделя">Н</button>
        <button role="tab" data-per="m" aria-selected="true" aria-label="Месяц">М</button>
        <button role="tab" data-per="all" aria-selected="false" aria-label="Всё время"><svg class="i" viewBox="0 0 24 24"><path d="M12 12c-2.2-2.6-3.9-4-5.6-4a4 4 0 0 0 0 8c1.7 0 3.4-1.4 5.6-4zm0 0c2.2 2.6 3.9 4 5.6 4a4 4 0 0 0 0-8c-1.7 0-3.4 1.4-5.6 4z"/></svg></button>
      </div>
      <div class="pnav" id="pNav"><button id="pPrev" aria-label="Раньше"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><span id="pLabel"></span><button id="pNext" aria-label="Позже"><svg class="i" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button></div>
    </div>
    <div id="dataBody"></div>
  </section>

  <nav class="tabbar" role="tablist" aria-label="Разделы">
    <button role="tab" data-tab="today" aria-selected="true" aria-label="Сегодня"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button role="tab" data-tab="month" aria-selected="false" aria-label="Месяц"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="14" rx="3"/><path d="M8 3.5v4M16 3.5v4M4 10h16"/></svg></button>
    <button role="tab" data-tab="data" aria-selected="false" aria-label="Данные"><svg class="i" viewBox="0 0 24 24"><path d="M4 18l5-6 4 3 7-9"/><path d="M15 6h5v5"/></svg></button>
  </nav>
</div>

<!-- ============ ЗАМЕР: экраны по одному ============ -->
<div class="flow" id="flow" hidden role="dialog" aria-modal="true" aria-labelledby="fTitle">
  <div class="fin">
    <header class="ftop">
      <button class="rbtn" id="fClose" aria-label="Закрыть замер"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div class="fprog" id="fProg"><i></i><i></i><i></i><i></i></div>
      <span class="fspace"></span>
    </header>
    <div class="fhead"><span class="kick" id="fKick"></span><h2 id="fTitle"></h2><p id="fHint"></p></div>
    <div class="stage" id="stage">
      <canvas id="stageCv" aria-label="Силуэт из точек: зоны, где ощущается голос"></canvas>
      <div class="zones" id="zones"></div>
      <div class="timer" aria-live="polite"><b class="num" id="tNum"></b><span id="tSub"></span></div>
    </div>
    <div class="fres" id="fRes"></div>
    <footer class="fctl" id="fCtl"></footer>
  </div>
</div>

<script src="../field.js"></script>
<script src="../voiceform.js"></script>
<script src="../voice3.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
