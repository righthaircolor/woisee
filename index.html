/* Layout: Swiss-style single column on warm grey paper. Huge numerals as heroes, hairline rules, a stack of colored block cards, a floating black capsule for nav and for the timer.
   Deliberately one light visual world, like the references. */
:root{
  /* palette, dark by default: Ebony ground, Vanilla text; Raspberry, Lemon Lime, Kale, Vanilla blocks; signal red */
  --paper:#121A19; --paper-2:#1D2826; --ink:#F4F2EC; --muted:#9AA7A3; --rule:rgba(255,254,252,.14); --soft:#2C3836;
  --signal:#F0472C; --lime:#ECF176; --deep:#DCDFD8;
  --rasp:#E780C0; --kale:#5EA879; --ebony:#192524; --vanilla:#FFFEFC;
  --f:"Inter Tight","Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;letter-spacing:-.005em}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
button:focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:10px}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:800;letter-spacing:-.03em}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.b-body,.b-breath,.b-phon,.b-stage,.b-artic{--cf:var(--ebony);--cl:rgba(25,37,36,.2);--cbox:rgba(255,255,255,.55);--ca:var(--ebony)}
.b-body{--c:var(--rasp);--cai:var(--rasp)} .b-breath{--c:var(--lime);--cai:var(--lime)} .b-phon{--c:var(--kale);--cai:var(--kale);--cbox:rgba(255,255,255,.4)} .b-stage{--c:#D6DCD5;--cai:#D6DCD5}
.b-artic{--c:var(--vanilla);--cai:var(--vanilla);--cbox:rgba(25,37,36,.07)}
.b-duo{--c:#C9E2D3;--cai:#C9E2D3;--cf:var(--ebony);--cl:rgba(25,37,36,.2);--cbox:rgba(255,255,255,.55);--ca:var(--ebony)}

.app{max-width:520px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:18px calc(110px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:26px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{font-weight:800;font-size:24px;letter-spacing:-.05em;cursor:pointer}
.hero-dur{text-align:right;color:var(--muted);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px;text-decoration-color:rgba(154,167,163,.5)}
.gobtn{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;background:var(--signal);color:#FFFEFC;border-radius:99px;padding:10px 10px 10px 26px;margin:0 0 22px;text-align:left}
.gobtn span{display:flex;flex-direction:column;gap:2px;min-width:0}
.gobtn b{font-size:20px;font-weight:700;letter-spacing:-.02em}
.gobtn small{font-size:14px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gobtn svg{flex:none;width:58px;height:58px;padding:17px;border-radius:50%;background:#FFFEFC;color:var(--signal)}
.choose-acts{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(112px + env(safe-area-inset-bottom,0px));z-index:22;display:flex;align-items:center;gap:14px;max-width:calc(100% - 36px);background:#2C3836;color:#F4F2EC;border-radius:99px;padding:10px 10px 10px 18px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.35);transition:opacity .35s}
.toast span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast button{flex:none;background:#F4F2EC;color:#192524;border-radius:99px;padding:8px 14px;font-weight:600}
.toast.out{opacity:0}
.streak{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;border:1px solid var(--rule);border-radius:99px;padding:7px 10px 7px 12px}
.streak svg{width:14px;height:14px;margin-left:-2px}
.back{display:flex;align-items:center;gap:4px;font-size:15px;font-weight:600;margin-left:-6px}
.back svg{width:22px;height:22px;transform:translateY(1px)}
.streak i{width:10px;height:10px;border-radius:50%;background:var(--signal);display:block}
.kicker{font-size:14px;color:var(--muted)}
.rule{border:0;border-top:1px solid var(--rule);margin:0}
.lnk{font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.note{font-size:14px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid currentColor;border-radius:99px;padding:3px 11px;font-size:13px;font-weight:500}
.redpill{display:inline-block;background:var(--signal);color:var(--paper-2);border-radius:99px;padding:2px 10px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}

/* choose */
.big-title{font-size:clamp(40px,12vw,54px);line-height:.95}
.menu{display:flex;flex-direction:column;border-top:1px solid var(--ink)}
.menu .item{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;width:100%;padding:18px 0;border-bottom:1px solid var(--ink)}
.menu .item b{font-weight:300;font-size:64px;line-height:.9;letter-spacing:-.05em;min-width:80px}
.menu .item span{font-size:15px;line-height:1.35}
.menu .item svg{width:22px;height:22px}
.menu .item:active{background:var(--lime)}
.menu .item[aria-pressed="true"] b{color:var(--signal)}
.warnbox{background:var(--lime);border-radius:18px;padding:14px 16px;font-size:15px}

/* today hero */
.hero{display:flex;flex-direction:column;gap:14px}
.hero-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.hero-row h2{font-size:30px;line-height:1}
.hero-row .kicker{text-align:right}
.count{display:block;white-space:nowrap}
.count b{font-weight:300;font-size:clamp(84px,26vw,112px);line-height:.8;letter-spacing:-.06em;margin-right:10px}
.count span{display:inline-block;vertical-align:baseline;white-space:normal;font-size:15px;line-height:1.2}
.hero-grid{margin-top:57px}
.hero-row:has(.hero-dur){align-items:flex-start}
.hero-dur{line-height:1;padding-top:2.4px}
.plate-hit{--hit-t:3px;--hit-b:5px;position:relative;display:flex;align-items:flex-end;align-self:stretch;cursor:pointer;-webkit-tap-highlight-color:transparent}
.plate-hit::after{content:"";position:absolute;inset:var(--hit-t,0) -18px var(--hit-b,0) -36px}
.tl{display:flex;gap:3px;height:22px;margin-top:4px}
.tl .s{position:relative;background:var(--soft);min-width:4px}
.tl .s.dn{background:var(--ink)}
.tl .s.cur{background:repeating-linear-gradient(135deg,var(--ink) 0 2px,transparent 2px 5px)}
.tl .s.cur::before{content:"";position:absolute;left:-2px;top:-8px;bottom:-8px;width:2px;background:var(--ink)}
.tl .s .redpill{position:absolute;top:32px;left:-2px}
.tl-foot{display:flex;justify-content:space-between;gap:12px;margin-top:30px;font-size:14px}

/* stack of block cards */
.stack{display:flex;flex-direction:column}
.wrapS{position:relative;display:flex;flex-direction:column;gap:12px}
#pathCv{position:absolute;left:0;top:0;pointer-events:none;z-index:2}
.b-body,.b-phon{--cdot:#FFFEFC} .b-breath,.b-artic,.b-stage{--cdot:#192524}
.blk{background:var(--c);color:var(--cf);border-radius:30px;padding:20px 20px 46px;margin-top:-28px;position:relative;box-shadow:0 -1px 0 rgba(25,37,36,.08)}
.blk:first-child{margin-top:0}
.blk:last-child{padding-bottom:20px}
.blk header{display:grid;grid-template-columns:1fr auto;align-items:start;gap:12px}
.blk .idx{font-size:13px;font-weight:500;opacity:.7}
.blk h3{font-size:34px;line-height:1}
.blk .sub{font-size:14px;opacity:.75;margin-top:6px}
.blk .cnt{font-weight:300;font-size:44px;line-height:.9;letter-spacing:-.05em}
.blk .cnt small{font-size:18px}
.blk.closed h3{font-size:28px}
.blk.closed .cnt{font-size:34px}
.blk.closed .sub{display:none}
.blk ul{list-style:none;margin:16px 0 0;padding:0;border-top:1px solid var(--cl)}
.blk ul.nofirst{border-top-color:transparent}
.blk .row{display:grid;grid-template-columns:1fr auto 34px;gap:12px;align-items:center;width:100%;padding:13px 0;border-bottom:1px solid var(--cl)}
.blk li:last-child .row,.blk .row.before{border-bottom-color:transparent}
.blk .row .t{font-size:17px;font-weight:500;line-height:1.25;min-width:0}
.blk .row .d{font-size:14px;opacity:.7}
.box{width:30px;height:30px;border-radius:9px;background:var(--cbox);display:grid;place-items:center;justify-self:end}
.box svg{width:16px;height:16px}
.row.dn .t{text-decoration:line-through;text-decoration-thickness:1.5px;opacity:.55}
.row.dn .d{opacity:.4}
.row.dn .box{background:var(--ca);color:var(--cai);border-radius:50%}
.blk .row.lk{opacity:.42;cursor:default}
.blk .row.cur{margin:10px -8px;width:calc(100% + 16px);padding:18px 10px 18px 20px;border-bottom-color:transparent;grid-template-columns:1fr auto 50px}
.blk .row.cur .t{font-size:18px;font-weight:700}
.blk .row.cur .box{width:50px;height:50px;border-radius:50%;background:var(--ca);color:var(--cai)}
.blk .row.cur .box svg{width:20px;height:20px}
.donecard{background:var(--lime);border-radius:30px;padding:22px 20px;display:flex;flex-direction:column;gap:14px;--cdot:#192524}
.donecard h3{font-size:32px;line-height:1}

/* feel rows */
.feel{display:flex;flex-direction:column;border-top:1px solid var(--ink)}
.feel button{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--ink);font-size:clamp(24px,7vw,30px);font-weight:500;text-transform:uppercase;letter-spacing:-.02em;width:100%}
.feel button::after{content:"";width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink)}
.feel button[aria-pressed="true"]::after{background:var(--ink)}

/* progress */
.p-hero{display:grid;grid-template-columns:auto 1fr;align-items:end;gap:14px}
.p-hero b{font-weight:800;font-size:clamp(120px,38vw,170px);line-height:.78;letter-spacing:-.07em}
.p-hero span{font-size:22px;font-weight:800;text-transform:uppercase;line-height:1;letter-spacing:-.02em;padding-bottom:6px}
.p-hero span small{display:block;font-size:22px;font-weight:300;color:var(--muted);text-transform:none;margin-top:4px}
.dots{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.dots .h{font-size:11px;text-align:center;color:var(--muted)}
.dots .h.t{color:var(--signal)}
.dots i{aspect-ratio:1;max-width:100%;border-radius:50%;background:var(--soft);display:block}
.dots i.on{background:var(--ink)}
.dots i.now{background:var(--signal)}
.dots i.fut{background:transparent;border:1px solid var(--soft)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.trio div{padding:14px 0 12px 12px;border-left:1px solid var(--rule);display:flex;flex-direction:column;gap:4px}
.trio div:first-child{border-left:0;padding-left:0}
.trio b{font-weight:300;font-size:44px;line-height:.9;letter-spacing:-.05em}
.trio span{font-size:13px;color:var(--muted)}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sec-h h3{font-size:24px}
.donut-card{background:var(--paper-2);border-radius:30px;padding:20px;display:flex;flex-direction:column;gap:12px}
.donut{width:min(260px,70vw);aspect-ratio:1;max-width:100%;margin:0 auto;display:block}
.donut-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.donut-foot b{font-weight:300;font-size:72px;line-height:.8;letter-spacing:-.05em}
.snd-row{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--rule)}
.snd-row button{padding:10px 0;display:flex;flex-direction:column;gap:2px;align-items:flex-start;padding-left:10px;border-left:1px solid var(--rule)}
.snd-row button:first-child{border-left:0;padding-left:0}
.snd-row b{font-size:20px;font-weight:600}
.snd-row span{font-size:12px;color:var(--muted)}
.snd-row button[aria-pressed="true"] b{color:var(--signal)}
.hist{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.hist li{display:grid;grid-template-columns:1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule);font-size:15px}
.hist .m{text-align:right;color:var(--muted)}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.sw{width:50px;height:30px;border-radius:99px;background:var(--soft);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--paper-2);transition:left .2s}
.sw[aria-pressed="true"]{background:var(--ink)}
.sw[aria-pressed="true"]::after{left:23px}

/* library */
.lib{display:flex;flex-direction:column}
.lib h3{display:flex;align-items:center;gap:12px;font-size:clamp(28px,8vw,34px);font-weight:500;text-transform:uppercase;letter-spacing:-.03em;padding:18px 0 10px;border-bottom:1px solid var(--ink)}
.lib h3 i{width:18px;height:18px;border-radius:50%;background:var(--c);display:block;flex:none}
.lib .item{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:baseline;width:100%;padding:13px 0;border-bottom:1px solid var(--rule);font-size:17px}
.lib .item .d{font-size:14px;color:var(--muted)}

/* floating nav capsule */
.nav{position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:5;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));pointer-events:none}
.nav nav{max-width:380px;margin:0 auto;background:var(--ink);border-radius:99px;padding:6px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;pointer-events:auto;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.nav button{padding:13px 0;border-radius:99px;color:var(--paper-2);font-size:14px;font-weight:500;text-align:center}
.nav button[aria-current="page"]{background:var(--paper-2);color:var(--ink)}

/* exercise screen */
.ex{position:fixed;inset:0;z-index:20;background:var(--paper);overflow-y:auto;-webkit-overflow-scrolling:touch}
.ex-head{background:var(--c);color:var(--cf);border-radius:0 0 34px 34px}
.ex-head .in,.ex-body{max-width:520px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.ex-head .in{padding-block:calc(env(safe-area-inset-top,0px) + 16px) 26px;display:flex;flex-direction:column;gap:16px}
.ex-top{display:grid;grid-template-columns:40px 1fr auto;gap:14px;align-items:center}
.icon-btn{width:40px;height:40px;border-radius:50%;background:var(--cbox);display:flex;align-items:center;justify-content:center}
.icon-btn svg{width:20px;height:20px}
.segs{display:flex;gap:2px;height:6px}
.segs i{flex:1;background:var(--cl);border-radius:1px}
.segs i.dn{background:var(--ca)}
.segs i.cur{background:var(--paper-2)}
.skip{font-size:14px;font-weight:600}
.ex-title{font-size:clamp(34px,10vw,44px);line-height:.98}
.clock{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.clock b{font-weight:300;font-size:clamp(76px,24vw,104px);line-height:.8;letter-spacing:-.06em;font-variant-numeric:tabular-nums}
.clock span{font-size:14px;padding-bottom:4px;text-align:right}
.ex-body{padding-block:22px calc(150px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:26px}
.sec{display:flex;flex-direction:column;gap:12px}
.sec h4{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding-bottom:8px;border-bottom:1px solid var(--ink)}
.sec .lead{font-size:19px;line-height:1.4;font-weight:400;letter-spacing:-.01em}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.steps li{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--rule);font-size:16px}
.steps li:first-child{padding-top:2px}
.steps .n{font-weight:300;font-size:30px;line-height:.9;letter-spacing:-.04em}
.feelbox{background:var(--lime);border-radius:22px;padding:16px 18px;font-size:16px}
.feelbox b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.widget{display:flex;flex-direction:column;gap:12px}
.read{background:var(--paper-2);border-radius:22px;padding:20px;font-size:20px;line-height:1.5;white-space:pre-line;letter-spacing:-.01em}
.read .by{display:block;font-size:13px;color:var(--muted);margin-top:10px;white-space:normal}
.task{font-weight:600}
.bigtxt{background:var(--paper-2);border-radius:22px;padding:18px;font-size:clamp(22px,7vw,30px);font-weight:500;letter-spacing:-.02em;line-height:1.3;text-align:center;overflow-wrap:anywhere}
.listrows{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.listrows li{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--rule);font-size:16px}
.listrows .a{color:var(--muted);text-align:right}
.ghost{align-self:flex-start;border:1px solid var(--ink);border-radius:99px;padding:9px 16px;font-weight:500;font-size:14px}
.pacer{background:var(--signal);border-radius:30px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:10px}
.pacer .wrap{position:relative;width:min(260px,70vw);aspect-ratio:1;max-width:100%}
.pacer svg{width:100%;height:100%;display:block}
.pacer .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--paper-2);text-align:center}
.pacer .lbl b{font-size:24px;font-weight:600;letter-spacing:-.02em}
.pacer .lbl span{font-size:44px;font-weight:300;line-height:1;font-variant-numeric:tabular-nums}
.pacer p{font-size:13px;color:var(--ink)}
.phase{background:var(--signal);border-radius:30px;padding:22px 20px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.phase b{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1}
.phase span{font-size:72px;font-weight:300;line-height:.8;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.swatch{background:var(--paper-2);border-radius:30px;padding:18px;display:flex;flex-direction:column;gap:14px}
.snds{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.snd{border:1px solid var(--ink);border-radius:16px;padding:12px 0;display:flex;flex-direction:column;align-items:center}
.snd b{font-size:22px;font-weight:600}
.snd span{font-size:11px;color:var(--muted)}
.snd[aria-pressed="true"]{background:var(--ink);color:var(--paper-2)}
.snd[aria-pressed="true"] span{color:var(--soft)}
.sw-line{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.sw-num{font-weight:300;font-size:clamp(72px,22vw,96px);line-height:.8;letter-spacing:-.06em;font-variant-numeric:tabular-nums}
.sw-btn{width:96px;height:96px;border-radius:50%;background:var(--ink);color:var(--signal);font-weight:700;font-size:16px;flex:none;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1}
.sw-btn.run{background:var(--signal);color:var(--ink)}
.rec{font-weight:700;color:var(--signal)}

/* timer capsule */
.tbar{position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:21;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.cap{position:relative;overflow:hidden;max-width:484px;margin:0 auto;background:var(--ink);color:var(--paper-2);border-radius:99px;padding:8px 8px 8px 26px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.cap .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--deep);transition:width .2s linear}
.cap .time,.cap .acts{position:relative}
.cap .time{display:flex;flex-direction:column}
.cap .time b{font-weight:300;font-size:34px;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.cap .time span{font-size:12px;opacity:.65}
.cap .time b.big{font-size:min(82px,calc((100vw - 223px) / 1.79));line-height:.73;letter-spacing:-.06em;position:relative;left:-10px;top:.7px}
.cap .acts{display:flex;align-items:center;gap:8px}

.pf-seg button svg{width:22px;height:22px}
.pf-seg button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.pf-nav{display:flex;align-items:center;gap:4px;border:1px solid var(--rule);border-radius:99px;padding:4px;flex:1;max-width:250px}
.pf-nav button{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none}
.pf-nav button svg{width:20px;height:20px}
.pf-nav button:disabled{opacity:.25}
.pf-nav span{flex:1;text-align:center;font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.pf-nav.static{justify-content:center;height:48px}
#pfBody{display:flex;flex-direction:column;gap:18px}
.pf-voice{border:1px solid var(--ink);border-radius:32px;padding:20px 20px 12px;display:flex;flex-direction:column;gap:6px}
.pf-vtop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.pf-vtxt{display:flex;flex-direction:column;gap:4px}
.pf-vtxt>span:not(.note){font-size:14px}
.pf-note{font-size:64px;font-weight:800;letter-spacing:-.05em;line-height:.95}
.pf-note.none{font-size:30px;letter-spacing:-.03em;line-height:1}
.pf-voice canvas{display:block;width:100%;margin-top:4px}
.mini{display:flex;gap:4px;flex:none}
.mini button{font-size:12px;font-weight:600;padding:6px 10px;border-radius:99px;color:var(--muted);border:1px solid var(--rule)}
.mini button[aria-selected="true"]{color:var(--paper);background:var(--ink);border-color:var(--ink)}
.pf-cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px 6px;justify-items:center}
.pf-wh{font-size:12px;color:var(--muted);font-weight:600}
.pf-cd{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%}
.pf-dc{width:100%;max-width:46px;aspect-ratio:1;border-radius:50%;position:relative;overflow:hidden;display:grid;place-items:center}
.pf-dc canvas{position:absolute;inset:0;width:100%;height:100%}
.pf-dc i{width:62%;aspect-ratio:1;border-radius:50%;border:1px dashed #3A4744}
.pf-dc.fut i{border-style:solid;border-color:rgba(255,254,252,.06)}
.pf-cd small{font-size:11px;color:var(--muted)}
.pf-cd.t small{color:var(--ink);font-weight:700}
.pf-map{display:block;width:100%}
.pf-maphead{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:-12px}
.pf-sday canvas{display:block;width:100%;max-width:340px;margin:0 auto}
.pf-fig{position:relative}
.pf-fig canvas{display:block;width:100%}
.pf-tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);font-size:12px;line-height:1.3;padding:7px 9px;border-radius:10px;white-space:nowrap;transform:translate(-50%,-100%);opacity:0;transition:opacity .12s;z-index:5}
</style>
</head>
<body>
<main class="app" id="view"></main>

<div class="nav"><nav>
  <button data-act="tab" data-v="track" id="t-track">Звучание</button>
  <button data-act="tab" data-v="path" id="t-path">Практика</button>
  <button data-act="tab" data-v="measure" id="t-measure">Голос</button>
  <button data-act="tab" data-v="library" id="t-library">Упражнения</button>
</nav></div>

<section class="ex" id="ex" hidden></section>
<div class="tbar" id="tbar" hidden></div>
<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<script src="voiceform.js"></script><script src="field.js"></script><script src="voice3.js"></script><script src="gifenc.js"></script><script src="supabase.js"></script><script src="tracker.js"></script>
<script>
/* ---------- blocks and exercises (from the guide) ---------- */
const BLOCKS=[
 {id:'body',name:'Тело',sub:'Свободное тело — главный резонатор'},
 {id:'breath',name:'Дыхание',sub:'Топливо голоса: опора и спокойствие'},
 {id:'phon',name:'Фонация',sub:'Чистый объёмный звук без напряжения'},
 {id:'artic',name:'Артикуляция',sub:'Чёткие слова и живая речь'}
];
const BNAME={body:'Тело',breath:'Дыхание',phon:'Фонация',artic:'Артикуляция',duo:'Вместе',stage:'Перед выступлением'};

const EX={
 semi:{b:'body',t:'Полулежачее положение',d:360,
  why:'Голос рождается в теле. Зажатая спина и шея сдавливают дыхание и гортань. Лёжа позвоночник отдыхает от нагрузки, и тело «перезагружается». Это упражнение из техники Александера: оно учит состоянию спокойного баланса, которое потом переносится в вертикальное положение.',
  steps:['Лягте на пол, не на мягкую кровать. Под голову положите стопку книг такой высоты, чтобы подбородок не задирался вверх и не прижимался к груди. Шея продолжает линию позвоночника.','Согните ноги в коленях, стопы поставьте на пол на ширине таза. Ладони положите на нижнюю часть живота.','Нажмите «Начать» и ничего не делайте. Пусть сила тяжести работает за вас.','Замечайте, где тело касается пола: крестец, лопатки, затылок. Мысленно позвольте спине растекаться по полу.','Дышите спокойно. Живот на вдохе поднимается под ладонями, на выдохе опускается.'],
  feel:'тяжесть и тепло в спине, плечи сами опускаются к полу.'},
 shoulders:{b:'body',t:'Плечи: сжать и отпустить',d:75,
  why:'Плечи, поднятые к ушам, — частый привычный зажим. Он тянет за собой шею и гортань, голос становится напряжённым. Сначала мы сознательно создаём сильное напряжение, потом сбрасываем его. Так тело запоминает разницу.',
  steps:['Встаньте или сядьте прямо.','Медленно поднимите плечи к ушам, сожмите их как можно сильнее. Держите 5 секунд.','Резко сбросьте плечи вниз и выдохните со звуком облегчения: «Ха-а-а».','Повторите 5 раз.','Затем медленно вращайте плечами назад 5 раз и вперёд 5 раз. Движение плавное и широкое.'],
  feel:'плечи становятся тяжёлыми и опускаются ниже, чем были.'},
 neck:{b:'body',t:'Наклоны головы',d:60,
  why:'Через шею проходит путь от дыхания к голосу. Напряжённая шея сжимает гортань. Мягкое растяжение освобождает пространство вокруг неё.',
  steps:['Медленно наклоните голову к правому плечу. Плечо не поднимайте навстречу.','Почувствуйте, как тянется левая сторона шеи. Задержитесь на 15 секунд и дышите.','Вернитесь в центр и так же наклонитесь к левому плечу на 15 секунд.','Медленно опустите подбородок к груди. Почувствуйте растяжение по задней стороне шеи.'],
  feel:'мягкое растяжение без боли. Если больно, уменьшите амплитуду.'},
 face:{b:'body',t:'Внутренняя улыбка',d:45,
  why:'Мышцы лица напрямую связаны с напряжением в челюсти и гортани. Когда расслабляется лицо, следом отпускает челюсть, и звук проходит свободнее.',
  steps:['Закройте глаза. Представьте лёгкую тёплую улыбку внутри, губами улыбаться не нужно.','Почувствуйте, как от этого ощущения расслабляются глаза, щёки и лоб.','Приоткройте рот и круговыми движениями помассируйте точку чуть впереди ушей. Здесь крепятся жевательные мышцы.','Сильно зажмурьтесь, сморщите нос и сожмите губы. Держите маску напряжения 5 секунд.','Полностью отпустите лицо. Пусть челюсть слегка отвиснет.'],
  feel:'разница между маской напряжения и мягким лицом после неё.'},
 jaw:{b:'body',t:'Свободная челюсть',d:90,
  why:'Челюсть — «врата голоса». Сжатые зубы и тугие жевательные мышцы сужают канал, по которому идёт звук, и голос становится глухим и сдавленным. Когда челюсть свободна, голос сразу звучит объёмнее.',
  steps:['Помассируйте жевательные мышцы чуть впереди ушей, рот приоткрыт.','«Отвалившаяся челюсть»: представьте, что нижняя челюсть очень тяжёлая и падает вниз под своим весом. Посидите так 30 секунд, дышите спокойно.','«Жвачка»: с закрытым ртом медленно жуйте огромную вязкую жвачку. Двигайте челюстью вниз, вверх, вправо и влево.','Произносите «ба-ба-ба», «да-да-да», «га-га-га». На каждой гласной челюсть свободно падает.'],
  feel:'зубы разомкнуты, челюсть висит, а не держится.'},
 diaphragm:{b:'breath',t:'Дыхание животом',d:60,
  why:'Поверхностное дыхание грудью делает голос слабым, высоким и прерывистым. Кстати, так тело дышит при волнении. Дыхание животом (диафрагмой) даёт голосу опору, глубину и выносливость, а вам — спокойствие.',
  steps:['Проверка: положите одну руку на грудь, другую на живот и сделайте обычный вдох. Если первой поднимается грудь, дыхание верхнее. Это мы и меняем.','Обе ладони положите на живот. Можно стоя, сидя или лёжа.','Представьте, что живот — воздушный шарик. Вдохните носом и позвольте шарику надуться. Грудная клетка почти не двигается.','Выдохните ртом и позвольте шарику медленно сдуться.','Продолжайте медленно, без усилия. Просто наблюдайте.'],
  feel:'на вдохе ладони поднимаются, плечи остаются на месте.'},
 dog:{b:'breath',t:'«Собачка»',d:75,type:'intervals',ph:[['Дышите',30],['Отдых',15],['Дышите',30]],
  why:'Тренирует диафрагму и мышцы живота, которые держат опору голоса. Заодно снимает зажим с горла: при таком дыхании оно просто не может напрячься.',
  steps:['Встаньте, слегка наклонившись вперёд, руки положите на колени.','Рот приоткрыт, язык лежит свободно.','Дышите часто и поверхностно, как собака в жаркий день.','На каждом вдохе и выдохе чувствуйте толчки живота.','Следуйте подсказкам: 30 секунд дышите, 15 отдыхаете, ещё 30 дышите.'],
  feel:'работает живот, горло остаётся мягким. Если закружилась голова, остановитесь.'},
 exhale:{b:'breath',t:'Долгий выдох: С · Ш · З · Ж',d:60,type:'exhale',
  why:'Опора — это не большой вдох, а управляемый выдох. Чем дольше и ровнее вы умеете выдыхать, тем длиннее фраза звучит без напряжения в горле в конце. Здесь же видно, как растёт результат.',
  steps:['Встаньте прямо, ноги на ширине плеч. Сделайте спокойный вдох животом.','Выберите звук [С] ниже и нажмите «Старт выдоха».','Выдыхайте на [с], как проколотая шина: долго, ровно, без рывков. Мышцы живота мягко поддерживают поток.','Когда воздух закончится, нажмите «Стоп». Время сохранится.','Повторите на [ш], затем на звонких [з] и [ж]. Звонким нужно больше контроля.'],
  feel:'ровный поток и мягкая работа пресса. Цель — 30–40 секунд, начинаем с 15. Без головокружения.'},
 box:{b:'breath',t:'Дыхание на счёт 4-4-8-4',d:100,type:'breath',
  why:'Выдох в два раза длиннее вдоха включает систему расслабления организма. Это тренировка контроля и одновременно лучший способ снять волнение перед выступлением или важным разговором.',
  steps:['Сядьте или встаньте прямо, дышите животом.','Нажмите «Начать» и следуйте за кругом.','Круг растёт — вдох на 4 счёта.','Круг замер — задержка на 4.','Круг сжимается — выдох на 8.','Круг замер маленьким — задержка на 4. Всего пять циклов.'],
  feel:'сердце замедляется, плечи опускаются.'},
 yawn:{b:'phon',t:'Зевок и мягкое нёбо',d:60,
  why:'Мягкое нёбо — «шторка» в глубине рта. Она решает, пойдёт звук в нос (гнусавость) или в рот. Зевок поднимает нёбо и расширяет глотку, и голос становится объёмным.',
  steps:['Сделайте глубокий, сладкий зевок.','Почувствуйте, как в глубине рта поднимается нёбо и расширяется горло.','На пике зевка произнесите: А-А-А, О-О-О, Э-Э-Э. Звук объёмный и глубокий.','Повторите несколько раз.','Попробуйте сохранить ощущение «купола» во рту и скажите обычную фразу.'],
  feel:'простор во рту, как в куполе.'},
 attack:{b:'phon',t:'Мягкая атака звука',d:75,
  why:'Атака — это то, как вы начинаете звук. Жёсткая, со щелчком в горле, травмирует связки. Придыхательная тратит воздух, и голос звучит слабо. Мягкая атака — здоровая середина и основа бережного голоса.',
  steps:['Жёсткая атака: скажите «А! А! А!», начиная каждый звук с резкого щелчка в горле. Почувствуйте напряжение. Так делать не нужно.','Придыхательная атака: скажите «ХА-ХА-ХА», как будто сначала выдох, потом звук. Слышно, как утекает воздух.','Мягкая атака: представьте, что дышите на зеркало, чтобы оно запотело, но со звуком.','Начните с лёгкого [h], которое сразу становится гласной: hа-а-а, hо-о-о, hу-у-у.','Ищите чистое начало: без щелчка и без лишнего воздуха.'],
  feel:'звук начинается легко, как будто сам.'},
 hum:{b:'phon',t:'Гудение',d:90,
  why:'Лучший массаж для голосовых складок. Гудение снимает напряжение с гортани и направляет звук вперёд. Его можно делать и в течение дня, чтобы «перезагрузить» голос.',
  steps:['Сядьте прямо. Губы сомкнуты, зубы слегка разомкнуты.','Сделайте вдох животом.','На выдохе гудите на звук [м].','Ищите лёгкую вибрацию, щекотку на губах, в носу и на передних зубах.','Сначала гудите на одной ноте, потом плавно скользите вверх и вниз, как сирена.'],
  feel:'щекотка на губах — значит звук направлен вперёд, а горло не напряжено.'},
 straw:{b:'phon',t:'Гудение в соломинку',d:60,
  why:'Соломинка создаёт сопротивление на выходе и выравнивает давление над и под связками. Они вибрируют в самом щадящем режиме. Это современный метод из логопедии и одно из лучших упражнений для уставшего голоса.',
  steps:['Возьмите обычную коктейльную соломинку и плотно обхватите её губами.','Гудите через неё. Звук будет резонировать по всему лицу.','Скользите по высоте вверх и вниз.','Напойте через соломинку простую мелодию.','Нет соломинки? Делайте трель губами («лошадка») или языком по всему диапазону.'],
  feel:'вибрацию в губах и щеках, горло свободно.'},
 resonators:{b:'phon',t:'Три резонатора',d:90,
  why:'Голосовые складки дают слабый звук. Силу и красоту ему придают резонаторы — грудь, рот и голова. Когда вы их чувствуете, можно звучать громко без напряжения.',
  steps:['Грудь: положите руку на верх груди. Низким глубоким голосом скажите «А-О-У». Ищите вибрацию под ладонью. Это теплота голоса.','Рот: скажите «ДА-ДА-ДА», «ЛА-ЛА-ЛА». Почувствуйте, как язык ударяет по твёрдому нёбу. Это ясность.','Голова: положите пальцы на переносицу. Долго тяните [м] или [н]. Ищите вибрацию под пальцами. Это звонкость и полётность.'],
  feel:'вибрация переходит из груди в лицо.'},
 eight:{b:'phon',t:'Фигура восьмёрки',d:60,type:'big',big:'МММААА · ООО · УУУ · ЭЭЭ · ИИИ',
  why:'Соединяет все резонаторы в один ровный звук: тепло груди и звонкость головы.',
  steps:['Представьте перед собой горизонтальную восьмёрку, знак бесконечности.','На одном выдохе ведите голос по её линии, произнося строку ниже.','На А и О ощущайте грудь и рот, на Э и И — голову.','Звук перетекает плавно, без рывков.','Повторите несколько раз.'],
  feel:'один непрерывный звук, который меняет цвет, но не рвётся.'},
 send:{b:'phon',t:'Посылка звука',d:75,
  why:'Развивает проекцию — умение быть слышной на расстоянии без крика. Звук не выталкивается силой, а направляется в точку.',
  steps:['Выберите в комнате предмет, например картину на стене.','«Пошлите» в него звук [а], как будто бросаете мячик. Не кричите, а фокусируйте звук.','Выберите предмет подальше и пошлите звук туда.','Затем поближе. Меняйте расстояние.','Замечайте, как меняется внутренняя настройка под разное расстояние.'],
  feel:'звук летит вперёд, горло не толкает.'},
 siren:{b:'phon',t:'Сирена',d:60,
  why:'Растягивает и тренирует мышцы гортани, расширяет диапазон. Чем шире диапазон, тем живее интонации в обычной речи.',
  steps:['Выберите звук [у] или [и].','Начните с самой низкой ноты, какую можете взять.','Плавно скользите голосом вверх до самой высокой, хоть до писка.','И так же плавно обратно вниз.','Делайте легко и играючи. Красота звука сейчас не важна.'],
  feel:'плавное скольжение без «ступенек» и без боли.'},
 volume:{b:'phon',t:'От шёпота до крика',d:75,type:'ladder',
  why:'Голос, который умеет быть и тихим, и громким, выразительнее. Главное — громкость берётся от дыхания, а не от напряжённого горла.',
  steps:['Возьмите слово, например «Далеко».','Произнесите его шёпотом, как секрет.','Тихо, как будто человек стоит рядом.','Громче, как будто он в другом конце комнаты.','Крикните, как будто он на другом берегу реки.','И пройдите весь путь обратно до шёпота.'],
  feel:'громкость растёт за счёт живота, горло свободно.'},
 swing:{b:'phon',t:'Интонационные качели',d:120,type:'phrase',
  why:'Монотонный голос усыпляет. Мелодия речи передаёт смысл и эмоцию: одна и та же фраза может значить совсем разное.',
  steps:['Возьмите фразу ниже.','Скажите её как утверждение: интонация в конце вниз.','Как вопрос: интонация вверх.','С сомнением: интонация идёт волной.','С восторгом: широкий диапазон, скачки вверх.','С сарказмом.'],
  feel:'как сильно меняется смысл от одной мелодии.'},
 gym:{b:'artic',t:'Артикуляционная разминка',d:45,

      ctx.fillStyle=getComputedStyle(host).getPropertyValue('--cdot').trim()||FC.dot;
      const still=REDUCED();pc.flow+=still?0:dt*.018;
      const k=still?1:1-Math.pow(1-.16,dt*60),o=[0,0,0,0];

        if(isNaN(p.x)){p.x=tx;p.y=ty;}

/* ---------- long exhale by day (elastic height up to 40 s, then the scale squeezes): thin columns of drifting dust, like the timeline on «Сегодня»; the latest day is red ---------- */
function exPoints(s){return Object.keys(data.days).sort().filter(k=>data.days[k].exhale&&data.days[k].exhale[s]).slice(-10).map(k=>({k,v:data.days[k].exhale[s]}));}
const exA={raf:0,list:[]};
function drawExDots(cv,s,mini){
  const pts=exPoints(s),B=mini?3:18,T=mini?3:18,top=Math.max(0,...pts.map(p=>p.v));
  /* elastic: 3.3 px per second, so the block is only as tall as the longest exhale; from 40 s on it stops growing and the scale squeezes */
  if(!mini){const PX=3.3,CAP=40;cv.style.height=Math.round(T+B+PX*Math.min(CAP,Math.max(top,8)))+'px';}
  const W=cv.clientWidth,H=cv.clientHeight;if(!W||!H)return;
  const maxV=mini?Math.max(40,top)*1.06:Math.max(8,top),y=v=>T+(H-T-B)*(1-v/maxV);
  const cols=Math.max(pts.length,mini?8:7),slot=W/cols,band=mini?2.5:5;
  const rng=(window.Field?Field.rng:(q=>{let x=q;return()=>(x=(x*16807)%2147483647)/2147483647;}))(12345+pts.length*97+Object.keys(SOUNDS).indexOf(s)*7919);
  const P=[],L=[];
  pts.forEach((p,i)=>{
    const cx=slot*(i+.5),top=y(p.v),h=H-B-top,last=i===pts.length-1,n=Math.round(band*h*(mini?.45:.34));
    for(let j=0;j<n;j++)P.push({hx:cx+(rng()-.5)*band,hy:top+rng()*h,p1:rng()*6.28,p2:rng()*6.28,sp:.6+rng()*1.4,last,z:.9+rng()*1.1});
    if(!mini){const dd=parseKey(p.k);L.push({x:cx,top,v:Math.round(p.v),d:dd.getDate()+'.'+pad(dd.getMonth()+1),last});}
  });
  exA.list=exA.list.filter(e=>e.cv!==cv&&e.cv.isConnected);
  exA.list.push({cv,W,H,B,P,L});
  if(!exA.raf)exA.raf=requestAnimationFrame(exFrame);
}
function exFrame(now){
  exA.list=exA.list.filter(e=>e.cv.isConnected);
  if(!exA.list.length){exA.raf=0;return;}
  const t=REDUCED()?0:now/1000;
  for(const e of exA.list){
    const ctx=fitCv(e.cv,e.W,e.H);ctx.clearRect(0,0,e.W,e.H);
    for(const q of e.P){
      const A=q.last?1.4:.9,px=q.hx+Math.sin(t*q.sp+q.p1)*A,py=q.hy+Math.cos(t*q.sp*1.3+q.p2)*A;
      ctx.fillStyle=q.last?FC.signal:FC.dot;ctx.globalAlpha=.85;ctx.fillRect(px-q.z/2,py-q.z/2,q.z,q.z);
    }
    ctx.globalAlpha=1;ctx.textAlign='center';
    for(const l of e.L){
      ctx.fillStyle=FC.dot;ctx.font='600 11px "Inter Tight", sans-serif';ctx.fillText(l.v,l.x,l.top-7);
      ctx.fillStyle='#9AA7A3';ctx.font='10px "Inter Tight", sans-serif';ctx.fillText(l.d,l.x,e.H-4);
    }
  }
  exA.raf=REDUCED()?0:requestAnimationFrame(exFrame);

/* ---------- voice map: 12 notes around, octave = distance from the centre; this week bright, earlier pale ---------- */
function mapNotes(days){
  const today=new Date(),out=[];
  for(let i=0;i<days;i++){const k=dkey(addDays(today,-i)),d=data.days[k];if(!d||!d.log)continue;
    d.log.forEach(L=>(L.notes||[]).forEach(n=>{if(n.midi!=null)out.push({midi:n.midi,sec:n.sec||1,age:i});}));}

function drawVoiceMap(cv){

  ctx.clearRect(0,0,s,s);

    Voice3.renderForm(ctx,cx+Math.cos(a)*rad,cy+Math.sin(a)*rad,s*.07,Math.round(u),Math.round(120+s*.3),900+q,rain?Voice3.HUE[pc]:FC.dot,n.age<7?1:.4,Math.max(.6,s/700),0,crisp);

}
function mapSummary(){

  const lo=Math.min(...ns.map(n=>n.midi)),hi=Math.max(...ns.map(n=>n.midi)),O=['ниже','комфортная','выше','ещё выше'];

/* ---------- GIF (9:16, no sound) ----------
   1. Голос tab: while the microphone is on, the form is drawn a second time every 1/12 s into a light recorder
      (only dot positions — no pixels, no audio). The best stretch of sound of the session becomes «the last GIF».
   2. Exercises: every running exercise keeps a 3-second clip of what its form did (the best stretch of voice,
      or simply the last seconds). The day is all of these clips laid over each other and played at once.
   Everything stays on the phone, in IndexedDB, for 14 days. */
const GIF_W=405,GIF_H=720,GIF_FPS=12,MOM_MAX=6,CLIP_SEC=3,CLIP_DOTS=1400,KEEP_DAYS=14;
const mom={buf:[],lastCap:0,seg:null,quiet:0,best:null,last:null,cache:new Map(),dayRaf:0};
const clip={buf:[],lastCap:0,seg:null,quiet:0,best:null,score:0};
const ICON_SHARE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7.5 7.5 12 3l4.5 4.5"/><path d="M8 11H6.5A1.5 1.5 0 0 0 5 12.5v7A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5v-7a1.5 1.5 0 0 0-1.5-1.5H16"/></svg>';

/* a fake 2d context that only remembers squares: position relative to the form centre in units of its radius */
function capCtx(w,h,scale){
  const R=Math.min(w,h)*(scale||.5),cx=w/2,cy=h/2,P=[],C=[],cols=[],idx=new Map();
  let fs='#ffffff',ci=0;
  return {R,P,C,cols,globalAlpha:1,
    set fillStyle(v){fs=v;let k=idx.get(v);if(k==null){k=cols.length;cols.push(v);idx.set(v,k);}ci=k;},
    get fillStyle(){return fs;},
    fillRect(x,y,ww){P.push((x+ww/2-cx)/R,(y+ww/2-cy)/R,ww/R,this.globalAlpha);C.push(ci);}};
}
function grab(L,w,h,scale,now,max){
  const c=capCtx(w,h,scale);L.draw(c,w,h,scale);
  const n=c.C.length,step=max?Math.max(1,Math.ceil(n/max)):1,m=Math.floor(n/step);
  const xy=new Int16Array(m*2),sa=new Uint8Array(m*2),ci=new Uint8Array(m);
  for(let i=0,j=0;i<m;i++,j+=step){const q=j*4;
    xy[i*2]=Math.max(-32767,Math.min(32767,Math.round(c.P[q]*8000)));xy[i*2+1]=Math.max(-32767,Math.min(32767,Math.round(c.P[q+1]*8000)));
    sa[i*2]=Math.min(255,Math.round(c.P[q+2]*4000));sa[i*2+1]=Math.round(Math.min(1,c.P[q+3])*255);ci[i]=c.C[j];}
  return {t:now,xy,sa,ci,cols:c.cols};
}
/* a stretch of sound: starts when something sounds, ends after 0.6 s of quiet */
function segTick(S,info,dt,now,onClose){
  const on=info.act&&!info.silent;
  if(on){if(!S.seg)S.seg={t0:now,dur:0,lvl:0};S.seg.dur+=dt;S.seg.lvl+=Math.min(1,info.level||.4)*dt;S.quiet=0;}
  else if(S.seg){S.quiet+=dt;if(S.quiet>.6){const s=S.seg;S.seg=null;S.quiet=0;onClose(s,now);}}
}
const segScore=(s,max)=>Math.min(max,s.dur)*(.4+s.lvl/Math.max(.01,s.dur));

/* ---- 1. Голос tab ---- */
function momCapture(L,w,h,scale,now){
  if(now-mom.lastCap<1000/GIF_FPS-4)return;mom.lastCap=now;
  mom.buf.push(grab(L,w,h,scale,now,0));
  while(mom.buf.length&&now-mom.buf[0].t>(MOM_MAX+2)*1000)mom.buf.shift();
}
function momTick(L,r,dt,now){segTick(mom,r.info,dt,now,momClose);}
function momClose(s,now){
  if(s.dur<2.5)return;
  const score=segScore(s,MOM_MAX),from=Math.max(s.t0-300,now-MOM_MAX*1000),frames=mom.buf.filter(f=>f.t>=from);
  if(frames.length<GIF_FPS*2)return;
  if(!mom.best||score>mom.best.score)mom.best={score,frames,day:dkey()};
}
/* microphone off: the best stretch of this session becomes the last GIF of the tab */
async function momFlush(){
  if(mom.seg){const s=mom.seg;mom.seg=null;momClose(s,performance.now());}
  const b=mom.best;mom.best=null;mom.buf=[];
  if(!b)return;
  try{
    const blob=await encodeGif(b.frames.length,(ctx,i)=>paintFrames(ctx,[b.frames[i]],1),b.day);
    mom.last={blob,day:b.day,at:Date.now()};await gifPut('last',mom.last);
    if(state.tab==='measure'&&!ex.open)lastGifBtn();
  }catch(e){}
}
async function lastGifBtn(){
  const st=document.querySelector('.vf-stage.free');if(!st)return;
  if(!mom.last){const r=await gifGet('last');if(r&&r.blob)mom.last=r;}
  let b=st.querySelector('.gif-ico');
  if(!mom.last){if(b)b.remove();return;}
  if(!b){st.insertAdjacentHTML('beforeend',`<button class="gif-ico" data-act="giflast" aria-label="Сохранить гифку">${ICON_SHARE}</button>`);}
}

/* ---- 2. exercises: one 3-second clip each ---- */
function clipReset(){clip.buf=[];clip.seg=null;clip.quiet=0;clip.best=null;clip.score=0;clip.lastCap=0;}
function clipCapture(L,w,h,scale,now){
  if(now-clip.lastCap<1000/GIF_FPS-4)return;clip.lastCap=now;
  clip.buf.push(grab(L,w,h,scale,now,CLIP_DOTS));
  while(clip.buf.length&&now-clip.buf[0].t>(CLIP_SEC+1)*1000)clip.buf.shift();
}
function clipTick(r,dt,now){segTick(clip,r.info,dt,now,(s,t)=>{
  if(s.dur<1.5)return;const sc=segScore(s,CLIP_SEC);
  if(sc>clip.score){const fr=clip.buf.filter(f=>f.t>=t-(CLIP_SEC+.6)*1000&&f.t<=t-500);if(fr.length>=GIF_FPS*1.5){clip.best=fr;clip.score=sc;}}
});}
/* called when an exercise is logged: keep the clip for the picture of the day */
function clipSave(k,n,id,b){
  if(clip.seg){const s=clip.seg;clip.seg=null;const t=performance.now();if(s.dur>=1.5){const sc=segScore(s,CLIP_SEC);if(sc>clip.score){clip.best=clip.buf.filter(f=>f.t>=t-CLIP_SEC*1000);clip.score=sc;}}}
  const fr=clip.best||clip.buf.slice(-CLIP_SEC*GIF_FPS);
  clipReset();
  if(fr.length<GIF_FPS)return;
  gifPut('c:'+k+':'+String(n).padStart(2,'0'),{id,b,frames:fr.map(f=>({xy:f.xy,sa:f.sa,ci:f.ci,cols:f.cols}))});
  mom.cache.delete('d:'+k);
}
async function dayClips(k){
  try{const db=await gifDb();return await new Promise(res=>{const out=[],rq=db.transaction('g').objectStore('g').openCursor(IDBKeyRange.bound('c:'+k+':','c:'+k+':~'));
    rq.onsuccess=ev=>{const c=ev.target.result;if(!c){res(out);return;}out.push(c.value);c.continue();};rq.onerror=()=>res(out);});}catch(e){return [];}

/* ---- painting ---- */
/* frames laid over each other; with many layers each one is fainter, so repeated shapes glow and the rest is haze */
function paintFrames(ctx,frames,mul,W,H,live){
  W=W||GIF_W;H=H||GIF_H;
  if(!live&&window.WT){const G=WT.gifLayout(W,H);paintAt(ctx,frames,mul,G.cx,G.cy,G.R*1.18,1);return;}
  paintAt(ctx,frames,mul,W/2,H*(live?.5:.46),W*(live?.56:.5),1);
}
function paintAt(ctx,frames,mul,cx,cy,R,minZ,mono){
  if(mono)ctx.fillStyle=mono;

    const xy=f.xy,sa=f.sa,ci=f.ci,n=ci.length;
    for(let i=0;i<n;i++){const z=Math.max(minZ,sa[i*2]/4000*R);if(!mono)ctx.fillStyle=f.cols[ci[i]];ctx.globalAlpha=Math.min(1,sa[i*2+1]/255*mul);ctx.fillRect(cx+xy[i*2]/8000*R-z/2,cy+xy[i*2+1]/8000*R-z/2,z,z);}

const layerMul=n=>Math.min(1,1.8/Math.sqrt(Math.max(1,n)));
/* a day without clips (practised before clips were kept): rebuilt from what the day remembers —
   every held note as its own form, every breathing or noisy exercise as its noise field, quiet ones as a faint haze —
   all laid over each other at one centre. No sectors, no block colours. */
function synthLayers(k){
  const d=data.days[k];if(!d)return [];
  const out=[];
  (d.log||[]).forEach((L,i)=>{
    const ns=(L.notes||[]).filter(n=>n.midi!=null).sort((a,b)=>(b.sec||0)-(a.sec||0)).slice(0,3);
    if(ns.length)ns.forEach((n,q)=>out.push({t:'n',u:uOfMidi(n.midi),seed:i*13+q*5+1}));
    else if((L.noiseSec||0)>2||L.noiseCentroid!=null||L.b==='breath')out.push({t:'z',cent:L.noiseCentroid!=null?L.noiseCentroid:.3,seed:i*13+3});
    else out.push({t:'q',seed:i*13+7});
  });
  if(!out.length&&d.done)d.done.forEach((id,i)=>out.push(EX[id]&&EX[id].b==='breath'?{t:'z',cent:.3,seed:i*13+3}:{t:'q',seed:i*13+7}));

}

/* still pictures of days (the week in the profile): the first frame of the clips, or the rebuilt day */

/* one palette from a few frames, then the frames are encoded in small slices of work */
async function encodeGif(n,paint,day){
  const {GIFEncoder,quantize,applyPalette}=window.GIFEnc;
  const cv=document.createElement('canvas');cv.width=GIF_W;cv.height=GIF_H;
  const ctx=cv.getContext('2d',{willReadFrequently:true});
  try{await document.fonts.load('800 22px "Inter Tight"');}catch(e){}
  const frame=i=>{ctx.globalAlpha=1;ctx.fillStyle=FC.ground;ctx.fillRect(0,0,GIF_W,GIF_H);paint(ctx,i);gifText(ctx,day);return ctx.getImageData(0,0,GIF_W,GIF_H).data;};
  const picks=[0,1,2,3,4,5,6,7].map(q=>Math.floor(q*(n-1)/7)),sample=new Uint8ClampedArray(GIF_W*GIF_H*4*picks.length);

async function dayGif(k){
  const key='d:'+k;

  else if(clips.length){const L=Math.max(...clips.map(c=>c.frames.length)),N=2*L-2,mul=layerMul(clips.length);blob=await encodeGif(N,(ctx,i)=>paintFrames(ctx,dayLayers(clips,i),mul),k);}
  else{const N=48;blob=await encodeGif(N,(ctx,i)=>paintPlateFrame(ctx,k,i/N),k);}

/* ---- the day, alive in the calendar sheet: same stage as the live voice, same layers as the GIF ---- */
async function dayStage(k){
  cancelAnimationFrame(mom.dayRaf);
  const cv=$('dayCv');if(!cv)return;
  const clips=await dayClips(k);
  const mul=layerMul(clips.length),t0=performance.now();
  const frame=now=>{
    const c=$('dayCv');if(!c){mom.dayRaf=0;return;}
    const {ctx,w,h}=fitLive(c),i=Math.floor((now-t0)/1000*GIF_FPS),sc=w/GIF_W;
    ctx.save();ctx.scale(sc,sc);
    const H=h/sc;

/* ---- sharing: «Сохранить изображение» in the iOS sheet puts it into Photos ---- */
async function gifShare(blob,name,btn){
  if(!blob)return;
  const file=new File([blob],name,{type:'image/gif'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return;}}catch(err){if(err&&err.name==='AbortError')return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);
}
async function gifAct(act,v,btn){
  if(act==='giflast'){if(mom.last)gifShare(mom.last.blob,'woisee-'+mom.last.day+'.gif',btn);return;}
  const key='d:'+v,blob=mom.cache.get(key);
  if(blob){gifShare(blob,'woisee-'+v+'.gif',btn);return;}
  /* not ready yet: make it, then one more tap opens the sheet (iOS only opens it right after a tap) */
  if(btn){btn.classList.add('wait');}
  try{await dayGif(v);}catch(e){}
  if(btn){btn.classList.remove('wait');btn.classList.add('ready');}
}

/* ---- small living picture of the day (Сегодня): the same layers, redrawn 12 times a second ---- */
const mini={list:[],raf:0};
async function miniDay(cv,k,opt){
  const clips=await dayClips(k);opt=opt||{};
  mini.list=mini.list.filter(e=>e.cv!==cv&&e.cv.isConnected);
  mini.list.push({cv,k,clips,mul:layerMul(clips.length)*(opt.mono?1:.85),last:-1,r:opt.r||.3,mono:opt.mono||null});
  if(!mini.raf)mini.raf=requestAnimationFrame(miniFrame);
}
function miniFrame(now){
  mini.list=mini.list.filter(e=>e.cv.isConnected);

  const i=Math.floor(now/1000*GIF_FPS);
  for(const e of mini.list){
    const live=window.WT&&WT.hasNote(e.k);
    if(!live&&i===e.last)continue;e.last=i;
    const s=e.cv.clientWidth;if(!s)continue;
    const ctx=fitCv(e.cv,s);ctx.clearRect(0,0,s,s);
    if(live&&WT.paintDay(ctx,e.k,e.clips,now/1000*GIF_FPS,s/2,s/2,s*e.r,e.mono)){}
    else if(e.clips.length)paintAt(ctx,dayLayers(e.clips,i),e.mul,s/2,s/2,s*e.r,.8,e.mono);
    else paintSynth(ctx,e.k,s/2,s/2,s*e.r*.95,.07*Math.sin(2*Math.PI*(i%96)/96),e.mono);
  }
  mini.raf=REDUCED()?0:requestAnimationFrame(miniFrame);
}

/* ---------- profile (design: «woisee · профиль») ----------
   Greeting with a living note-avatar: the dots of her comfortable note flow around the letters of «Привет, <имя>»,

const pr={raf:0,sim:null,measure:null,fontRev:0,last:0};

/* the avatar's field: the comfortable note's own form (rays by note, rings by octave, a twist for sharps) */
function prField(){
  const ref=profNote(),u=ref!=null?uOfMidi(ref):19,P=Voice3.params(u);
  const rain=data.profile.rain!==false,base=rain?Voice3.toHex(Voice3.noteColor(u)):'#E04FB4';

/* where the greeting breaks and where the note sits: after the shortest line, never more than 20 px past the edge */

const ok=k=>data.days[k]&&data.days[k].seconds>=60;
/* one streak: a day counts with a voice print or with a minute of practice (tracker.js) */
function streak(){if(window.WT)return WT.streak();let d=new Date();if(!ok(dkey(d)))d=addDays(d,-1);let n=0;while(ok(dkey(d))){n++;d=addDays(d,-1);}return n;}
function daysBefore(k){return Object.keys(data.days).filter(x=>x<k&&ok(x)).length;}
function getDay(k){if(!data.days[k])data.days[k]={date:k,seconds:0,plan:null,done:[],dur:null,focus:null,feel:null,exhale:{}};const d=data.days[k];d.done=d.done||[];d.exhale=d.exhale||{};return d;}
function focusFor(k){const d=data.days[k];if(d&&d.focus){const f=FOCI.find(x=>x.id===d.focus);if(f)return f;}return FOCI[daysBefore(k)%FOCI.length];}
const BI=id=>BLOCKS.findIndex(b=>b.id===EX[id].b);
function buildPlan(min,focus){
  const items=[];if(min>=30)items.push('semi');items.push(...CORE);
  let rem=min*60-sumD(items);
  for(const id of focus.ex){if(items.includes(id))continue;if(EX[id].d<=rem+45){items.push(id);rem-=EX[id].d;}}
  if(rem>=100&&!items.includes('reading'))items.push('reading');
  return items.map((id,i)=>({id,i})).sort((a,b)=>BI(a.id)-BI(b.id)||a.i-b.i).map(o=>o.id);
}
function todayPlan(){const d=data.days[dkey()];return d&&d.plan?d:null;}
/* where the day stands: a strict path — always the first exercise not yet done, in plan order.
   (d.at only remembers the second she stopped at inside that exercise.) */
function curOf(d){
  if(!d||!d.plan)return null;
  return d.plan.find(id=>!d.done.includes(id))||null;
}
function nextUndone(plan,done,after){
  const start=after==null?0:plan.indexOf(after)+1;
  for(let j=start;j<plan.length;j++)if(!done.includes(plan[j]))return plan[j];
  for(let j=0;j<start&&j<plan.length;j++)if(!done.includes(plan[j]))return plan[j];
  return null;
}

    label=ex.mode!=='plan'?'упражнение выполнено':nx?'дальше: '+EX[nx].t:'последнее упражнение дня';
    acts=`<button class="go" data-act="next">${ex.mode!=='plan'?'Выйти':nx?'Дальше':'Финиш'}</button>`;}
  $('tbar').innerHTML=`<div class="cap ${fin?'fin':''}"><i class="fill" id="tFill" style="width:${fin?100:Math.min(100,el/dur*100)}%"></i><div class="time"><b id="tTime" class="${fin?'':'big'}">${fin?'Готово':fmt(rem)}</b>${label?`<span>${esc(label)}</span>`:''}</div><div class="acts">${acts}</div></div>`;
}
function tick(){
  if(!ex.open)return;
  const e=EX[ex.id],el=elapsed(),dur=e.d+ex.extra,rem=dur-el;
  if(ex.status!=='done'){
    const bc=$('bigClock');if(bc)bc.textContent=fmt(rem);
    const cl=$('clockLbl');if(cl)cl.textContent=ex.status==='run'?'осталось':ex.status==='pause'?'пауза':'таймер';
  }
  if(ex.status==='run'&&Math.floor(elapsed()/5)!==ex.posT){ex.posT=Math.floor(elapsed()/5);savePos();}
  if(ex.status==='run'){const tt=$('tTime');if(tt)tt.textContent=fmt(rem);const tf=$('tFill');if(tf)tf.style.width=Math.min(100,el/dur*100)+'%';}
  if(e.type==='breath'){
    let r=40,lbl='Готовы?',num='';
    if(ex.status==='run'||ex.status==='pause'){
      const c=el%20,phases=[['Вдох',0,4],['Задержка',4,8],['Выдох',8,16],['Задержка',16,20]];
      const pi=phases.findIndex(p=>c>=p[1]&&c<p[2]),p=phases[pi];
      r=pi===0?40+48*(c/4):pi===1?88:pi===2?88-48*((c-8)/8):40;lbl=p[0];num=String(Math.floor(c-p[1])+1);
      if(ex.status==='run'&&ex.phase!==-1&&ex.phase!==pi)chimePhase();ex.phase=pi;
    }else if(ex.status==='done')lbl='Готово';
    if($('pcC'))$('pcC').setAttribute('r',r.toFixed(1));if($('pcLbl')){$('pcLbl').textContent=lbl;$('pcNum').textContent=num;}
  }
  if(e.type==='intervals'){
    let acc=0,pi=e.ph.length-1;for(let j=0;j<e.ph.length;j++){if(el<acc+e.ph[j][1]){pi=j;break;}acc+=e.ph[j][1];}
    const L=$('phLbl'),N=$('phNum');
    if(ex.status==='done'){if(L){L.textContent='Готово';N.textContent='';}}
    else{if(L){L.textContent=e.ph[pi][0];N.textContent=fmt(acc+e.ph[pi][1]-el);}if(ex.status==='run'&&ex.phase!==-1&&ex.phase!==pi)chimePhase();if(ex.status==='run')ex.phase=pi;}
  }
  if(e.type==='exhale'&&$('swNum')){const sw=ex.sw,v=sw.running?(now()-sw.start)/1000:(sw.last||0);$('swNum').textContent=v.toFixed(1);}
  if(ex.status==='run'&&rem<=0)complete(true);
}
function go(){
  audioInit();
  if(HAS_FORM&&ex.status==='ready'&&needMicAsk()){askMic();return;}
  if(needWarn()){askWarn();return;}
  if(ex.status==='ready'||ex.status==='pause'){
    const first=ex.status==='ready';
    ex.since=now();ex.status='run';lockScreen();renderBar();
    const w=HAS_FORM&&$('vfCv')?$('vfCv'):$('focusW');if(w&&first)w.scrollIntoView({behavior:'smooth',block:'center'});
    if(HAS_FORM)startListening();
  }
  tick();
}
function pause(){if(ex.status!=='run')return;ex.acc=elapsed();ex.since=null;ex.status='pause';savePos();if(HAS_FORM)stopListening();renderBar();tick();}
function complete(withSound){
  ex.acc=elapsed();ex.since=null;ex.status='done';
  if(withSound)chimeEnd();
  countTime();
  const k=dkey(),d=getDay(k);
  if(ex.mode==='plan'&&d.plan&&d.plan.includes(ex.id)&&!d.done.includes(ex.id)){d.done.push(ex.id);}
  if(d.plan&&d.at===ex.id){d.at=curOf(d);d.atAcc=0;d.atExtra=0;}
  saveDay(k);
  if(HAS_FORM){stopListening();logExercise();}
  const bc=$('bigClock');if(bc)bc.textContent='0:00';const cl=$('clockLbl');if(cl)cl.textContent='готово';
  const seg=document.querySelector('.segs i.cur');if(seg)seg.className='dn';
  renderBar();tick();
}
function nextEx(){
  const d=todayPlan();
  if(ex.mode!=='plan'||!d){closeEx();return;}
  const nx=curOf(d);
  if(nx){countTime();openEx(nx,'plan');}else showDayDone();
}
/* leaving in the middle: ask first; the timer waits */
function askClose(){
  ex.paused4ask=ex.status==='run';if(ex.paused4ask)pause();
  openSheet(`<h3>Точно закончить упражнение?</h3><p>Прогресс сохранится: в следующий раз продолжите с того же места.</p>
    <div class="sheet-acts"><button class="primary" data-act="closeno">Продолжить упражнение</button><button class="ghost wide" data-act="closeyes">Выйти</button></div>`);
}
/* the safety note appears once a day, when the first exercise starts */
function needWarn(){const d=todayPlan();return ex.mode==='plan'&&ex.status==='ready'&&d&&!d.warned&&!(d.done||[]).length;}
function askWarn(){
  openSheet(`<h3>Перед началом</h3><p>Ни одно упражнение не должно вызывать боль. Лёгкое растяжение — нормально, резкая боль — сигнал остановиться.</p>
    <div class="sheet-acts"><button class="primary" data-act="warnok">Понятно, начинаем</button></div>`);
}
function showDayDone(){
  logExercise();if(HAS_FORM)formClose();
  countTime();clearInterval(ex.timer);unlockScreen();
  const k=dkey(),d=getDay(k),st=streak(),mins=Math.round(d.seconds/60);
  $('tbar').hidden=true;$('ex').className='ex win';
  $('ex').innerHTML=`<div class="win-in">
    <button class="logo" data-act="home" aria-label="На главную" style="align-self:flex-start">woisee</button>
    <h1 class="huge">Готово.</h1>
    <div class="mins"><b class="num">${mins}</b><span>${plural(mins,'минута','минуты','минут')}<br>голоса сегодня</span></div>
    ${st?`<p style="font-size:18px">${st} ${plural(st,'день','дня','дней')} подряд. Все четыре блока пройдены.</p>`:''}
    ${HAS_FORM?`<canvas class="win-plate" id="winPlate" aria-label="Картинка дня"></canvas><p class="note" style="color:var(--ink)">${window.WT&&WT.dayNotes(k).length?'Картинка дня: все упражнения, наложенные друг на друга, и нота дня, которая проступает из них.':'Картинка дня: все упражнения сегодня, наложенные друг на друга.'}</p><button class="blackbtn" data-act="gifday" data-v="${k}">Сохранить гифку дня ${ICON_ARROW}</button>`:''}
    ${window.WT&&HAS_FORM?WT.winBlock(k):''}
    ${feelBlock(d.feel)}
    ${typeof acctNudge==='function'?acctNudge():''}
    <button class="blackbtn" data-act="close">На главную ${ICON_ARROW}</button></div>`;
  $('ex').scrollTop=0;
  if(HAS_FORM){miniDay($('winPlate'),k,{mono:'#192524',r:.36});setTimeout(()=>dayGif(k).catch(()=>{}),2600);}
}
function swToggle(){
  const sw=ex.sw,btn=$('swBtn');audioInit();
  if(!sw.running){sw.running=true;sw.start=now();btn.textContent='Стоп';btn.classList.add('run');$('swRec').hidden=true;if(ex.status==='ready')go();}
  else{
    sw.running=false;const v=Math.round((now()-sw.start)/100)/10;sw.last=v;btn.innerHTML='Ещё<br>попытка';btn.classList.remove('run');
    if(v>=2){
      const k=dkey(),d=getDay(k),prevBest=(data.profile.bests||{})[sw.sound]||0;
      if(!d.exhale[sw.sound]||v>d.exhale[sw.sound]){d.exhale[sw.sound]=v;saveDay(k);}
      if(v>prevBest){data.profile.bests=Object.assign({},data.profile.bests,{[sw.sound]:v});saveProfile();
        const r=$('swRec');r.hidden=false;r.textContent=prevBest?`Новый рекорд: ${v} сек`:`Первый результат: ${v} сек`;tone(880,0.4,0.15);
        const bl=$('best-'+sw.sound);if(bl)bl.textContent='рекорд '+Math.round(v);}
      const hh=$('swHist');if(hh){hh.innerHTML=exhaleHist(sw.sound);paintPlates(hh);}
    }
  }
  tick();
}

/* ---------- backup ---------- */
function exportData(){
  try{
    const blob=new Blob([JSON.stringify({app:'woisee',v:1,saved:new Date().toISOString(),data},null,1)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='woisee-'+dkey()+'.json';
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);
    $('bkNote').textContent='Файл копии создан. Сохраните его в «Файлы».';
  }catch(e){$('bkNote').textContent='Не получилось создать файл. Попробуйте ещё раз.';}
}
document.addEventListener('change',ev=>{
  if(ev.target.id!=='bkFile'||!ev.target.files[0])return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const j=JSON.parse(r.result),inc=j&&j.data&&j.data.days?j.data:null;
      if(!inc)throw new Error('format');
      for(const k in inc.days){const L=data.days[k],R=inc.days[k];if(!L||(R.seconds||0)>(L.seconds||0))data.days[k]=R;}
      const b=Object.assign({},data.profile.bests);for(const s in (inc.profile&&inc.profile.bests)||{})b[s]=Math.max(b[s]||0,inc.profile.bests[s]);
      data.profile.bests=b;saveLocal();render();
      const n=$('bkNote');if(n)n.textContent='Копия загружена: '+Object.keys(inc.days).length+' дн.';
    }catch(e){const n=$('bkNote');if(n)n.textContent='Это не файл копии woisee. Выберите файл woisee-ГГГГ-ММ-ДД.json.';}
  };
  r.readAsText(ev.target.files[0]);ev.target.value='';
});

/* ---------- events ---------- */
document.addEventListener('click',ev=>{
  if(ev.target.id==='scrim'){closeSheet();return;}
  const b=ev.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,v=b.dataset.v;
  switch(a){
    case 'tab':if(v!=='measure'){freeMicOff();msStop();}state.tab=v;state.choosing=false;render();window.scrollTo(0,0);break;
    case 'mtab':if(v!=='free')freeMicOff();msStop();state.mtab=v;render();break;
    case 'msnd':if(!ms.running){ms.sound=v;ms.last=null;ms.rec='';render();}break;
    case 'msw':msToggle();break;
    case 'freemic':freeMic();break;
    case 'rain':data.profile.rain=data.profile.rain===false;saveProfile();if(HAS_FORM&&vf.live)vf.live.setOpts(formOpts({}));render();break;
    case 'lace':data.profile.lace=data.profile.lace!==true;saveProfile();if(HAS_FORM&&vf.live)vf.live.setOpts(formOpts({}));render();break;
    case 'streak':state.from=['profile','settings'].includes(state.tab)?state.from:state.tab;state.tab='profile';state.choosing=false;render();window.scrollTo(0,0);break;
    case 'profile':state.tab='profile';render();window.scrollTo(0,0);break;
    case 'settings':state.tab='settings';render();window.scrollTo(0,0);break;
    case 'signin':acctSignIn();break;
    case 'signout':acctSignOut();break;
    case 'prnote':{const c=$('prNoteCard');if(c)c.scrollIntoView({behavior:REDUCED()?'auto':'smooth',block:'center'});break;}
    case 'dur':{const k=dkey(),d=getDay(k),f=focusFor(k),np=buildPlan(+v,f);
      (d.done||[]).forEach(id=>{if(!np.includes(id))np.push(id);});
      d.dur=+v;d.focus=f.id;d.plan=np.map((id,i)=>({id,i})).sort((a,b)=>BI(a.id)-BI(b.id)||a.i-b.i).map(o=>o.id);saveDay(k);
      state.choosing=false;state.tab='path';render();window.scrollTo(0,0);
      const c=curOf(d);if(c)openEx(c,'plan');break;}
    case 'restart':{const k=dkey(),d=getDay(k);d.done=[];d.log=[];d.seconds=0;d.at=null;d.atAcc=0;delete d.feel;saveDay(k);
      if(HAS_FORM&&window.clipsClear)clipsClear(k);
      state.choosing=false;render();window.scrollTo(0,0);const c=curOf(d);if(c)openEx(c,'plan');break;}
    case 'home':if(ex.open)closeEx();closeSheet();state.tab='path';state.choosing=false;render();window.scrollTo(0,0);break;
    case 'start':openEx(v,'plan');go();break;
    case 'choose':state.choosing=true;render();window.scrollTo(0,0);break;
    case 'openday':openDay(v);break;
    case 'print':if(window.WT)WT.open(null,()=>render());break;
    case 'printafter':if(window.WT)WT.open('after',()=>{if(ex.open)showDayDone();else render();});break;
    case 'topractice':state.tab='path';state.choosing=true;render();window.scrollTo(0,0);break;
    case 'cancelChoose':state.choosing=false;render();break;
    case 'ex':openEx(v,'plan');break;
    case 'single':openEx(v,'single');break;
    case 'close':if(ex.status==='run'||ex.status==='pause')askClose();else closeEx();break;
    case 'closeyes':closeSheet();closeEx();break;
    case 'closeno':closeSheet();if(ex.paused4ask){ex.paused4ask=false;go();}break;
    case 'warnok':{const d=getDay(dkey());d.warned=true;saveDay(dkey());closeSheet();go();break;}
    case 'go':go();break;
    case 'pause':pause();break;
    case 'plus':ex.extra+=30;tick();break;
    case 'finishNow':complete(false);break;
    case 'next':nextEx();break;
    case 'sound':data.profile.sound=data.profile.sound===false;saveProfile();audioInit();render();break;
    case 'zonelab':data.profile.zl2=1;data.profile.zoneLabels=data.profile.zoneLabels==='chakra'?'body':'chakra';saveProfile();render();break;
    case 'psnd':state.sound=v;render();break;
    case 'snd':if(!ex.sw.running){ex.sw.sound=v;ex.sw.last=null;document.querySelectorAll('.snd').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===v));$('swRec').hidden=true;$('swBtn').innerHTML='Старт<br>выдоха';$('swHist').innerHTML=exhaleHist(v);paintPlates($('swHist'));tick();}break;
    case 'sw':swToggle();break;
    case 'export':exportData();break;
    case 'import':$('bkFile').click();break;
    case 'shareplate':sharePlate(v);break;
    case 'gifday':case 'giflast':gifAct(a,v,b);break;
    case 'day':openDay(v);break;
    case 'closesheet':closeSheet();break;
    case 'micyes':data.profile.mic='asked';saveProfile();closeSheet();go();break;
    case 'micno':data.profile.micOff=true;saveProfile();closeSheet();go();break;
    case 'mic':data.profile.micOff=!(data.profile.micOff===true);saveProfile();render();break;
    case 'resetref':data.profile.ref=null;if(HAS_FORM&&vf.live&&vf.live.voice.recalibrate){vf.live.voice.ref=null;vf.live.voice.recalibrate();}saveProfile();render();break;
    case 'tw':ex.tw=(ex.tw+1)%TWISTERS.length;$('twText').textContent=TWISTERS[ex.tw];break;
    case 'ph':ex.ph=(ex.ph+1)%PHRASES.length;$('phText').textContent=PHRASES[ex.ph];break;
    case 'wd':ex.word=(ex.word+1)%WORDS.length;$('wdText').textContent='«'+WORDS[ex.word]+'»';break;
    case 'poem':ex.poem=(ex.poem+1)%POEMS.length;$('poemText').innerHTML=poemHTML(POEMS[ex.poem]);break;
    case 'feel':{const k=dkey(),d=getDay(k);d.feel=v;saveDay(k);
      document.querySelectorAll('.feel button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===v));
      const fn=$('feelNote');if(fn)fn.textContent=FEEL_NOTE[v];break;}
  }
});

loadLocal();
/* earlier builds saved the profile's Тело/Чакры switch as the default: back to body parts once, chakras only from the settings */
if(!data.profile.zl2){delete data.profile.zoneLabels;data.profile.zl2=1;saveLocal(true);}
render();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
if('serviceWorker' in navigator)window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
if(typeof acctInit==='function')acctInit();
</script>
</body>
